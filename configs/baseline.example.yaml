experiment:
  name: vla_adapter_libero_spatial_baseline
  seed: 0

dataset:
  name: libero_spatial_no_noops
  root: data/libero

model:
  name: vla_adapter
  pretrained_path: pretrained_models/prism-qwen25-extra-dinosiglip-224px-0_5b
  freeze_vlm: true

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  max_steps: 1000
  checkpoint_interval: 500

evaluation:
  episodes_per_task: 10
  save_rollout_videos: true
